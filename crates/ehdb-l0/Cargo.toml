[package]
name = "ehdb-l0"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "EHDB L0 — replicated object-store layer: immutable parts + ClickHouse-style meta-catalog + hot-local/durable-async tiering over a pluggable object store. noetl-internal only (fixed datasets)."

[dependencies]
# Chain-certified projections (noetl/ai-meta#366) — compiled in only under the
# `chain-cert` feature, which is off by default.
sha2 = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
ehdb-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# Execution-affinity partitioning hash, byte-identical to the worker/server
# `shard_for` and `ehdb-reference::affinity::shard_for_i64` (XxHash64 seed 0).
twox-hash.workspace = true

[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true
tempfile = "3"

[features]
chain-cert = ["dep:sha2", "dep:hex"]
# Hardware SHA-256. Carries most of the win on aarch64; pulls `cc` as a build
# dependency, so it is a separate opt-in from the certificate itself.
chain-cert-asm = ["chain-cert", "sha2/asm"]

[[bench]]
name = "l0_engine"
harness = false

[[bench]]
name = "vector_query"
harness = false
