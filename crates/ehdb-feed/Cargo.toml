[package]
name = "ehdb-feed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "EHDB L1 — networked change-feed delivery over the L0 Watch(shard,cursor) primitive: the per-shard writer's push transport to subscribers. noetl-internal only."

[dependencies]
ehdb-core.workspace = true
ehdb-l0.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# TCP keepalive on every feed socket (noetl/ai-meta#208): tokio exposes only
# `set_nodelay`, so the keepalive setters come from socket2 (already in the tree
# as tokio's own dependency).  `all` is what gates the interval/retries setters.
socket2 = { version = "0.5", features = ["all"] }
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
