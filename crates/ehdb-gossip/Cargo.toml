[package]
name = "ehdb-gossip"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "SWIM gossip transport feeding membership transitions into EHDB's D8 runtime log"

[dependencies]
ehdb-core = { path = "../ehdb-core" }
ehdb-l0 = { path = "../ehdb-l0" }
# noetl/ai-meta#332 — transport + failure detection ONLY. All membership STATE
# lives in EHDB (D8). foca does no I/O and has two required deps of its own.
foca = { version = "2", features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
rand = "0.10"

[dev-dependencies]
tempfile = "3"
